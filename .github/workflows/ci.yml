name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install (CPU torch suffit aux tests rapides)
        run: uv sync --frozen --extra prod
      - name: Lint
        run: uv run ruff check src tests && uv run ruff format --check src tests
      - name: Tests rapides (les lents lisent les données et les poids Chronos-2)
        run: uv run pytest
