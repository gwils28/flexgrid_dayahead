# Protocole pré-enregistré. Versionné avant le premier calcul de prévision : changer une valeur
# ci-dessous après avoir vu des résultats est une déviation, datée ici et reportée dans
# IMPLEMENTATION_NOTES.md (la valeur d'origine reste écrite).

data:
  eco2mix: {start: "2015-01-01", end: "2026-07-01"}
  # Hors de cette plage, une valeur nationale devient manquante. Record national : ~102 GW (février 2012).
  national_range_mw: [25000, 105000]
  # Segment Enedis : plage relative à la médiane du segment (pas de record par segment).
  segment_range_vs_median: [0.05, 5.0]
  # DÉVIATION (ajoutée le 2026-08-21, avant toute prévision) : la règle ci-dessus retire 7 399 pas réels de
  # 84_P4_ENT1, segment chauffé à l'électricité dont l'hiver vaut 6 fois l'été. Plage remplaçante, bas relatif
  # à la médiane, haut relatif au quantile 99,9 % : [0,05 x médiane, 2 x q99,9].
  segment_range: {low_vs_median: 0.05, high_vs_q999: 2.0}
  fill_linear_max_steps: 4      # 2 h ; au-delà, même pas une semaine plus tôt, listé au rapport de trous
  local_tz: Europe/Paris

portfolio:
  # FlexGrid = somme de ces segments (région_tranche_profil), choisis sur leur énergie annuelle.
  segments: ["24_P2_ENT1", "27_P2_ENT1"]
  scale_national_to_gwh: 800    # mise à l'échelle du national, pour comparaison seulement (SPEC, angle mort 6)

panel:
  sector: "S3: Tertiaire"
  bands: [P1, P2, P4, P5, P6]   # tranches disjointes (P3, P7 sont des sous-totaux)
  min_sites: 50
  max_missing: 0.005

clock:
  issue_local: "09:00"          # J-1, heure de Paris
  national_known_until_local: "08:00"   # dernier pas national observé à l'émission (J-1)
  segments_known_until: end_of_d_minus_2
  weather_lead_day: 2           # previous_day2 : toujours publié à l'émission (SPEC)

windows:
  # Jours de livraison J (dates locales).
  validation: ["2025-01-01", "2025-06-30"]   # apprentissage du router, calibration conforme initiale
  test: ["2025-07-01", "2026-06-30"]         # verdict : 365 origines quotidiennes

models:
  snaive_day: {season: 48}
  snaive_week: {season: 336}
  mstl: {seasons: [48, 336], trend: "AutoETS(ZZN)", train_steps: 2688}       # 8 semaines
  ets_seasonal: {season: 48, spec: ZZA, train_steps: 1344}                     # leçon W25 : saison forcée
  lgbm:
    objective: quantile
    refit: weekly                 # réappris chaque lundi d'émission, sur tout l'historique connu
    num_boost_round: 600
    learning_rate: 0.05
    num_leaves: 63
    min_data_in_leaf: 100
    feature_fraction: 0.8
    # DÉVIATION (2026-08-27, avant toute prévision) : 4,25 M lignes pour le panel, 55 s par quantile et par
    # réapprentissage, soit ~8 h de backtest. Sous-échantillonnage de 30 % des lignes par arbre : 26 s.
    bagging_fraction: 0.3
    bagging_freq: 1
    seed: 18
    weather_train: observed       # ERA5 ; météo prévue à l'inférence (SPEC, angle mort 7)
  chronos2: {checkpoint: amazon/chronos-2, context_steps: 2048, covariates: false}
  chronos2_cov: {checkpoint: amazon/chronos-2, context_steps: 2048, covariates: true}
  ensemble: {members: [lgbm, chronos2_cov], rule: quantile_average}
  # ADDENDUM (2026-10-16) : Timestral (Mistral AI, sorti le 2026-10-15) et TimesFM 3.0 (Google Research,
  # 2026-08-31). Écrit avant toute prévision de ces modèles, mais après avoir vu les résultats de tous les autres :
  # c'est un ajout déclaré (IMPLEMENTATION_NOTES), pas une partie du protocole d'origine. Rien au-dessus ne change.
  # Entrées identiques à Chronos-2 (chronos.make_input). covariates : none | weather (temp., nébulosité,
  # rayonnement) | full (météo + férié, pont, vacances scolaires, week-end). L'écart full / weather mesure le
  # calendrier. Réglages publiés par défaut ; aucun réglage choisi sur le test.
  chronos2_wx: {family: chronos2, checkpoint: amazon/chronos-2, context_steps: 2048, covariates: weather}
  timestral: {family: timestral, checkpoint: mistralai/Timestral-209M, context_steps: 2048, covariates: none}
  timestral_wx: {family: timestral, checkpoint: mistralai/Timestral-209M, context_steps: 2048, covariates: weather}
  timestral_cov: {family: timestral, checkpoint: mistralai/Timestral-209M, context_steps: 2048, covariates: full}
  # 5M : le plus petit, sur CPU, pour savoir si un TSFM peut tourner en production sans GPU.
  timestral5m: {family: timestral, checkpoint: mistralai/Timestral-5M, context_steps: 2048, covariates: none, device: cpu}
  timestral5m_wx: {family: timestral, checkpoint: mistralai/Timestral-5M, context_steps: 2048, covariates: weather, device: cpu}
  timestral5m_cov: {family: timestral, checkpoint: mistralai/Timestral-5M, context_steps: 2048, covariates: full, device: cpu}
  # TimesFM 3.0 émet 9 quantiles (0,1-0,9) : q0,25/q0,75 interpolés, q0,05/q0,95 extrapolés (queues gaussiennes).
  timesfm3: {family: timesfm3, checkpoint: google/timesfm-3.0-pytorch, context_steps: 2048, covariates: none}
  timesfm3_wx: {family: timesfm3, checkpoint: google/timesfm-3.0-pytorch, context_steps: 2048, covariates: weather}
  timesfm3_cov: {family: timesfm3, checkpoint: google/timesfm-3.0-pytorch, context_steps: 2048, covariates: full}
  # Contexte long : chaque TSFM à son maximum (Chronos-2 8 192 pas, TimesFM 15 360, Timestral 32 768 = 1,9 an,
  # qui contient la même saison de l'année précédente). Mesure ce que 2 048 pas (42,7 jours) laissent de côté.
  # Segments : le portefeuille seul (le router et le cold-start ne lisent que les variantes à 2 048 pas).
  chronos2_cov_long: {segments_units: [FLEXGRID], family: chronos2, checkpoint: amazon/chronos-2, context_steps: 8192, covariates: full}
  timesfm3_cov_long: {segments_units: [FLEXGRID], family: timesfm3, checkpoint: google/timesfm-3.0-pytorch, context_steps: 15360, covariates: full}
  timestral_cov_long: {segments_units: [FLEXGRID], family: timestral, checkpoint: mistralai/Timestral-209M, context_steps: 32768, covariates: full}
  # Mélanges ajoutés (exploratoires : leur composition s'inspire du succès connu de `ensemble`).
  ens_lgbm_timestral: {members: [lgbm, timestral_cov], rule: quantile_average}
  ens_lgbm_timesfm3: {members: [lgbm, timesfm3_cov], rule: quantile_average}
  ens_lgbm_tsfm3: {members: [lgbm, chronos2_cov, timestral_cov, timesfm3_cov], weights: [0.5, 0.1667, 0.1667, 0.1666], rule: quantile_average}
  ens_all4: {members: [lgbm, chronos2_cov, timestral_cov, timesfm3_cov], rule: quantile_average}
  # A POSTERIORI (2026-10-18), après avoir vu le national : Timestral à contexte long y fait presque aussi bien
  # que LightGBM seul. Ce mélange est un résultat exploratoire, jamais un verdict ; dit comme tel partout.
  ens_lgbm_timestral_long: {members: [lgbm, timestral_cov_long], rule: quantile_average, post_hoc: true}
  # Benchmarks (national seulement).
  rte_j1: {alignment: same}
  rte_j1_debiased: {alignment: same, window_days: 28}

# Grille de quantiles émise par tous les modèles probabilistes.
quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

metrics:
  mase_seasonality: 336
  smape: textbook               # 2|e| / (|y| + |f|), bornée par 2 (utilsforecast en donne la moitié)
  point: [mae, mape, smape, wape, mase]
  probabilistic: [pinball, crps, cov50, cov80, cov90, width90, winkler90]
  # CRPS approché par 2 x la pinball moyenne sur la grille de 7 quantiles : une approximation, dite comme telle.

conformal:
  # Réparation a posteriori d'un intervalle : médiane conservée, quantiles reconstruits à partir des erreurs
  # absolues des `calibration_days` origines précédentes, au même pas de la journée.
  calibration_days: 56

verdict:
  reference: rte_j1
  reference_strong: rte_j1_debiased
  alignment_sensitivity: previous   # « bat RTE » exige la victoire sous les deux lectures
  # « C bat la référence » ssi l'IC 95 % du ratio des MAE moyens (C / référence) est entièrement sous 1.
  ratio_ci: 0.95
  coverage90_band: [0.85, 0.95]     # « déployable tel quel » ssi la couverture 90 % tombe dans cette bande
  bootstrap: {block_days: 7, replicates: 2000, seed: 18}

cost:
  # Écart (MWh) = |réalisé - nomination| x 0,5 h ; nomination = médiane du modèle.
  # Coût = écart x |prix day-ahead| x k. k = 1 : définition du brief (borne haute) ; k = 0,1-0,5 : pénalité.
  nomination_quantile: 0.5
  k_headline: 1.0
  k_scenarios: [0.1, 0.25, 0.5]

router:
  units: panel_segments
  branches: [lgbm, chronos2_cov]
  features:          # ex-ante, calculées sur les 8 semaines précédant le premier jour de la fenêtre
    - history_days
    - n_sites
    - mean_mw
    - seasonal_strength_48
    - seasonal_strength_336
    - cv
    - naive_noise          # MAE de la naïve hebdomadaire / moyenne
    - temp_sensitivity     # pente conso / température journalière (MW/°C), en valeur absolue relative
  policies: [always_lgbm, always_chronos2_cov, ensemble, learned_stump, oracle]
  # ADDENDUM (2026-10-16) : router à quatre branches. Le stump coupe les segments en deux groupes et donne à
  # chacun la branche au MASE total le plus bas sur la validation. Le router d'origine est recalculé à l'identique.
  branches4: [lgbm, chronos2_cov, timestral_cov, timesfm3_cov]
  policies4: [always_timestral_cov, always_timesfm3_cov, learned_stump4, oracle4, ens_lgbm_tsfm3, ens_all4]
  # Le stump est appris sur la fenêtre de validation, appliqué tel quel sur l'année de test.
  drift: {trailing_days: 28}

cold_start:
  # Historique tronqué à chaque origine, pour les segments du panel.
  history_days: [7, 14, 28, 56]
  models: [snaive_week, lgbm, chronos2, chronos2_cov, chronos2_fewshot]
  # ADDENDUM (2026-10-16). Few-shot Timestral : les frères (même tranche et profil, autres régions) entrent comme
  # covariables passées, avec 2 048 pas ; la cible tronquée est complétée à gauche par des valeurs manquantes,
  # ce que Timestral accepte. TimesFM 3.0 exige des covariables de la longueur de la cible : pas de few-shot.
  models_addendum: [timestral, timestral_cov, timestral5m_cov, timesfm3, timesfm3_cov, timestral_fewshot]
  # few-shot in-context : Chronos-2 en cross_learning, le lot contient le segment tronqué et les segments de
  # même tranche et profil des autres régions, avec leur historique complet, coupés au même instant.

seed: 18

# ADDENDUM (2026-10-16) : quelles questions l'ajout des deux TSFM doit trancher, et comment.
addendum_2026_10_16:
  # 1. Un nouveau TSFM bat-il Chronos-2 + covariables ? Ratio de MAE (IC 95 %, blocs de 7 jours) sur le national
  #    et le portefeuille, même règle que le verdict contre RTE.
  # 2. Le calendrier aide-t-il ? Ratio de MAE full / weather pour chaque TSFM, sur tous les jours, les fériés et
  #    les ponts de l'année de test. Moins de 20 jours fériés ou ponts : l'IC sera large, on le sait d'avance.
  # 3. Le service change-t-il de modèle ? Seulement si un mélange de l'addendum a un MAE plus bas que `ensemble`
  #    sur le portefeuille pendant la VALIDATION (janvier-juin 2025) ; l'année de test confirme ou infirme.
  holiday_day_types: [holiday, bridge]
  production_switch_window: validation
  # Licence : poids de TimesFM 3.0 non commerciaux ; projet personnel de veille, sans usage commercial (choix de
  # l'auteur). Poids Timestral sous MIT modifiée.

