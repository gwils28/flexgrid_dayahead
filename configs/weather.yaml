# Une ville par région métropolitaine (hors Corse, absente d'éCO2mix national et d'Enedis).
# Poids = population régionale, estimations INSEE au 1er janvier 2024 arrondies (millions).
# Simplification déclarée : une grande région (Occitanie, Auvergne-Rhône-Alpes) n'a qu'un point.
variables: [temperature_2m, cloud_cover, shortwave_radiation]
observed: {api: https://archive-api.open-meteo.com/v1/archive, model: era5}
forecast: {api: https://previous-runs-api.open-meteo.com/v1/forecast, model: ecmwf_ifs025, lead_days: [1, 2]}
regions:
